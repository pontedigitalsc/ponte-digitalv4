<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" role="img" aria-label="Ponte Digital" focusable="false">
  <!-- Ponte Digital — "Clareza" (P100B, fundo claro): 8 fragmentos nas margens (sinais entrando),
       malha Bézier que converge e continua além do centro (conexão → evolução),
       centro de clareza no encontro (losango + eixos + pontas = contexto/inteligência). -->
