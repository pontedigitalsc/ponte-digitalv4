    <path d="M 30 17 Q 120 34 210 61" stroke="hsl(221, 72%, 45%)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 30 83 Q 120 66 210 39" stroke="hsl(221, 72%, 45%)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 210 17 Q 120 34 30 61" stroke="hsl(221, 72%, 45%)" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M 210 83 Q 120 66 30 39" stroke="hsl(221, 72%, 45%)" stroke-width="2.8" stroke-linecap="round"/>
  </g>
  <circle cx="30" cy="17" r="3.5" fill="hsl(226, 64%, 14%)"/>
  <circle cx="30" cy="39" r="3.5" fill="hsl(226, 64%, 14%)"/>
  <circle cx="30" cy="61" r="3.5" fill="hsl(226, 64%, 14%)"/>
  <circle cx="30" cy="83" r="3.5" fill="hsl(226, 64%, 14%)"/>
  <circle cx="210" cy="17" r="3.5" fill="hsl(226, 64%, 14%)"/>
  <circle cx="210" cy="39" r="3.5" fill="hsl(226, 64%, 14%)"/>
  <circle cx="210" cy="61" r="3.5" fill="hsl(226, 64%, 14%)"/>
  <circle cx="210" cy="83" r="3.5" fill="hsl(226, 64%, 14%)"/>
  <line x1="120" y1="50" x2="126.4" y2="43.6" stroke="hsl(165, 34%, 26%)" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="50" x2="113.6" y2="43.6" stroke="hsl(165, 34%, 26%)" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="50" x2="126.4" y2="56.4" stroke="hsl(165, 34%, 26%)" stroke-width="2" stroke-linecap="round"/>
  <line x1="120" y1="50" x2="113.6" y2="56.4" stroke="hsl(165, 34%, 26%)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 120 42 L 126 50 L 120 58 L 114 50 Z" fill="hsl(165, 34%, 26%)"/>
